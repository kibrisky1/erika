<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beat Filippo &amp; Erika</title>
<style>
:root{--pink:#ff4d94;--purple:#8b5cf6;--cyan:#22d3ee;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07060f;color:#fff;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));display:block;border-radius:10px;box-shadow:0 0 60px rgba(139,92,246,.35),0 0 120px rgba(34,211,238,.15);touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,3,12,.82);backdrop-filter:blur(4px);z-index:5}
.hidden{display:none!important}
.panel{text-align:center;padding:32px 40px;border:2px solid rgba(139,92,246,.55);border-radius:18px;background:linear-gradient(160deg,rgba(23,16,48,.95),rgba(9,7,22,.95));box-shadow:0 0 40px rgba(139,92,246,.35);max-width:90%}
h1{font-size:clamp(26px,5vw,52px);letter-spacing:3px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(24px,4vw,42px);letter-spacing:2px}
.sub{margin:10px 0 18px;color:#c7d2fe;letter-spacing:1px}
.controls-help{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin-bottom:22px;font-size:14px;color:#a5b4fc}
.controls-help b{color:#fff}
.btn{font:inherit;font-weight:800;letter-spacing:2px;padding:14px 34px;border:0;border-radius:12px;cursor:pointer;color:#12061f;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 6px 24px rgba(255,77,148,.4);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn.secondary{background:#334155;color:#fff;margin-left:10px}
.warn{margin-top:16px;color:#fbbf24;font-size:14px}
#mobile{position:absolute;inset:auto 0 12px 0;display:none;justify-content:space-between;padding:0 14px;z-index:4;pointer-events:none}
.mbtn{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(20,16,40,.65);color:#fff;font-weight:800;font-size:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.mbtn.punch{width:78px;height:78px;background:rgba(255,77,148,.75);border-color:#fff}
.mbtn.small{width:58px;height:58px;font-size:10px}
.pad{display:flex;gap:10px;align-items:flex-end;pointer-events:none}
@media (pointer:coarse){#mobile{display:flex}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="960" height="540"></canvas>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>BEAT FILIPPO &amp; ERIKA</h1>
    <p class="sub">A 2D arcade fighting game</p>
    <div class="controls-help">
      <span><b>A / D</b> or <b>&larr; &rarr;</b> Move</span>
      <span><b>W</b> or <b>&uarr;</b> Jump</span>
      <span><b>Space</b> Punch</span>
      <span><b>Shift</b> Block</span>
      <span><b>P</b> Pause</span>
    </div>
    <button id="startBtn" class="btn">START FIGHT</button>
    <p id="filippoWarn" class="warn hidden">Add Filippo&rsquo;s image as <b>filippo.jpg</b> in the same folder as this HTML file.</p>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>PAUSED</h2>
    <button id="resumeBtn" class="btn">RESUME</button>
    <button id="quitBtn" class="btn secondary">RESTART</button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <h2 id="overTitle">VICTORY</h2>
    <p id="overScore" class="sub">SCORE: 0</p>
    <button id="againBtn" class="btn">FIGHT AGAIN</button>
  </div>
</div>

<div id="mobile">
  <div class="pad">
    <button id="btnLeft" class="mbtn">&#9664;</button>
    <button id="btnRight" class="mbtn">&#9654;</button>
  </div>
  <div class="pad">
    <button id="btnBlock" class="mbtn small">BLOCK</button>
    <button id="btnJump" class="mbtn small">JUMP</button>
    <button id="btnPunch" class="mbtn punch">PUNCH</button>
  </div>
</div>
</div>

<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=960,H=540,GROUND=458,GRAV=2500;
const ui={menu:document.getElementById('menu'),pause:document.getElementById('pause'),over:document.getElementById('over'),overTitle:document.getElementById('overTitle'),overScore:document.getElementById('overScore'),filippoWarn:document.getElementById('filippoWarn')};

const keys={},touch={left:false,right:false,jump:false,punch:false,block:false};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyP'&&(state==='playing'||state==='paused'))togglePause();if(e.code==='Enter'&&state==='menu')startGame();});
addEventListener('keyup',e=>keys[e.code]=false);
function bindBtn(id,prop){const el=document.getElementById(id);const on=e=>{e.preventDefault();touch[prop]=true;};const off=e=>{e.preventDefault();touch[prop]=false;};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);}
bindBtn('btnLeft','left');bindBtn('btnRight','right');bindBtn('btnJump','jump');bindBtn('btnPunch','punch');bindBtn('btnBlock','block');

const Sfx={ctx:null,init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},blip(f1,f2,dur,type,vol){if(!this.ctx)return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+dur);},punch(){this.blip(240,90,.09,'square',.16);},hit(){this.blip(520,120,.14,'sawtooth',.22);},block(){this.blip(900,480,.08,'triangle',.14);},ko(){this.blip(320,40,.55,'sawtooth',.28);},win(){this.blip(440,900,.45,'triangle',.22);}};

const particles=[],floats=[];let shake=0;
function spawnParticles(x,y,n,color,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.35+Math.random());particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-140,life:.35+Math.random()*.3,color,size:2+Math.random()*3.5});}}
function addFloat(x,y,text,color,big){floats.push({x,y,text,color,life:.95,big:!!big});}
function updateEffects(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;if(p.life<=0)particles.splice(i,1);}for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=55*dt;if(f.life<=0)floats.splice(i,1);}if(shake>0)shake-=dt;}
function drawEffects(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2.2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}ctx.globalAlpha=1;ctx.textAlign='center';for(const f of floats){ctx.globalAlpha=Math.min(1,f.life*1.6);ctx.font=(f.big?'bold 30px':'bold 20px')+' "Segoe UI",sans-serif';ctx.fillStyle='#000';ctx.fillText(f.text,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);}ctx.globalAlpha=1;}

class Fighter{
constructor(cfg){Object.assign(this,{x:200,y:GROUND,vx:0,vy:0,facing:1,hp:100,maxHp:100,speed:260,jumpV:-860,state:'idle',animT:0,attackT:0,cooldown:0,hitstun:0,flash:0,blocking:false,blockT:0,ko:false,koT:0,hasHit:false,aiT:0,attackDmg:8,attackRange:100,windup:.13,attackDur:.34,attackCooldown:.9,knockback:260,heavy:false,blockChance:.35,rethink:1,dash:false,isPlayer:false,name:'',bodyW:52,bodyH:145},cfg);}
get airborne(){return this.y<GROUND-1;}
rect(){return{x:this.x-this.bodyW/2,y:this.y-this.bodyH,w:this.bodyW,h:this.bodyH};}
startAttack(){if(this.cooldown>0||this.state==='attack'||this.hitstun>0||this.ko)return;this.state='attack';this.attackT=0;this.hasHit=false;Sfx.punch();}
tryHit(foe){if(!foe||foe.ko||this.hasHit)return;const dir=this.facing,hx=dir>0?this.x+14:this.x-94,box={x:hx,y:this.y-128,w:80,h:118},r=foe.rect();
if(box.x<r.x+r.w&&box.x+box.w>r.x&&box.y<r.y+r.h&&box.y+box.h>r.y){this.hasHit=true;const blocked=foe.blocking&&Math.sign(foe.x-this.x)===-dir;let dmg=this.attackDmg*(0.9+Math.random()*.2);const crit=Math.random()<.15;if(crit)dmg*=1.6;
if(blocked){dmg*=.22;Sfx.block();spawnParticles((this.x+foe.x)/2,foe.y-85,8,'#e0f2fe',200);}else{foe.hitstun=.28;Sfx.hit();spawnParticles(foe.x,foe.y-85,12,'#ffd166',300);}
dmg=Math.max(1,Math.round(dmg));foe.hp=Math.max(0,foe.hp-dmg);foe.flash=.18;foe.vx=dir*this.knockback*(blocked?.25:1);if(!blocked&&this.heavy)foe.vy=-280;
addFloat(foe.x,foe.y-150,(blocked?'BLOCK ':'')+dmg+(crit?'!':''),crit?'#ff5470':(blocked?'#93c5fd':'#fff'),crit);
if(this.isPlayer&&!blocked)onPlayerHit(dmg,crit);
if(foe.hp<=0){foe.ko=true;foe.state='ko';foe.vx=dir*320;foe.vy=-320;Sfx.ko();spawnParticles(foe.x,foe.y-85,26,'#ff9f43',360);shake=.55;}}}
physics(dt){this.vy+=GRAV*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.y>=GROUND){this.y=GROUND;this.vy=0;}this.vx*=Math.pow(this.airborne?.9:.004,dt);this.x=Math.max(48,Math.min(W-48,this.x));}
update(dt,foe){this.animT+=dt;if(this.cooldown>0)this.cooldown-=dt;if(this.flash>0)this.flash-=dt;
if(this.ko){this.koT+=dt;this.physics(dt);return;}
if(this.hitstun>0){this.hitstun-=dt;this.state='hit';this.physics(dt);return;}
if(this.state==='attack'){this.attackT+=dt;if(!this.hasHit&&this.attackT>=this.windup&&this.attackT<=this.windup+.12)this.tryHit(foe);if(this.attackT>=this.attackDur){this.state='idle';this.cooldown=this.attackCooldown;}this.vx*=Math.pow(.02,dt);}
this.physics(dt);}
}

const player=new Fighter({isPlayer:true,name:'YOU',hp:130,maxHp:130,speed:305,attackDmg:10,attackRange:105,windup:.10,attackDur:.30,attackCooldown:.40,knockback:300,bodyW:50,bodyH:150});
const erika=new Fighter({name:'ERIKA',hp:100,maxHp:100,speed:270,jumpV:-900,attackDmg:7,attackRange:100,windup:.11,attackDur:.30,attackCooldown:.85,knockback:230,blockChance:.5,rethink:.75,dash:true,bodyW:50,bodyH:150});
const filippo=new Fighter({name:'FILIPPO',hp:120,maxHp:120,speed:175,jumpV:-800,attackDmg:14,attackRange:118,windup:.18,attackDur:.40,attackCooldown:1.55,knockback:430,heavy:true,blockChance:.3,rethink:1.35,bodyW:62,bodyH:170});
const enemies=[erika,filippo];
function aliveEnemies(){return enemies.filter(e=>!e.ko);}

const filippoImg=new Image();let filippoReady=false,filippoFailed=false;
const filippoCandidates=['filippo.jpg','filippo.jpeg','filippo.png','filippo.JPG','filippo.JPEG'];
let filippoCandidate=0;
function loadFilippo(){if(filippoCandidate>=filippoCandidates.length){filippoFailed=true;ui.filippoWarn.classList.remove('hidden');return;}filippoImg.src=filippoCandidates[filippoCandidate];}
filippoImg.onload=()=>{filippoReady=true;filippoFailed=false;ui.filippoWarn.classList.add('hidden');};
filippoImg.onerror=()=>{filippoCandidate++;loadFilippo();};
loadFilippo();

let score=0,combo=0,comboT=0,bestCombo=0;
function onPlayerHit(dmg,crit){combo++;comboT=2;bestCombo=Math.max(bestCombo,combo);const mult=1+Math.floor(combo/3)*.5;const pts=Math.round(100*mult*(crit?1.5:1));score+=pts;addFloat(player.x,player.y-190,'+'+pts,'#fbbf24',true);}

function updateEnemy(e,dt){if(e.ko){e.update(dt,player);return;}const p=player,dx=p.x-e.x,dist=Math.abs(dx);if(e.hitstun>0){e.update(dt,p);return;}
e.facing=dx>0?1:-1;e.aiT-=dt;
if(p.state==='attack'&&dist<e.attackRange+34&&e.blockT<=0&&Math.random()<e.blockChance*dt*60)e.blockT=.45;
e.blocking=e.blockT>0;if(e.blockT>0)e.blockT-=dt;
if(e.state!=='attack'){if(dist>e.attackRange*.72){e.vx=e.facing*e.speed;e.state='walk';}else{e.vx*=.6;e.state='idle';if(e.cooldown<=0&&e.aiT<=0){e.startAttack();e.aiT=e.rethink;}else if(e.aiT<=0){e.aiT=.35+Math.random()*.8;if(Math.random()<.28)e.vy=e.jumpV;if(e.dash&&Math.random()<.4)e.vx=e.facing*e.speed*2.3;}}}
e.update(dt,p);}

function updatePlayer(dt){const p=player;if(p.ko||p.hitstun>0){p.update(dt,aliveEnemies()[0]||null);return;}
const left=keys.KeyA||keys.ArrowLeft||touch.left,right=keys.KeyD||keys.ArrowRight||touch.right;
p.blocking=(keys.ShiftLeft||keys.ShiftRight||touch.block)&&!p.airborne;
let mv=0;if(left)mv-=1;if(right)mv+=1;
if(p.state!=='attack'){p.vx=mv*p.speed;p.state=mv!==0?'walk':'idle';if(mv!==0)p.facing=mv;}
const jump=keys.KeyW||keys.ArrowUp||touch.jump;
if(jump&&!p.airborne&&p.state!=='attack')p.vy=p.jumpV;
if(keys.Space||touch.punch)p.startAttack();
const foe=aliveEnemies()[0];if(foe&&p.state!=='attack')p.facing=foe.x>p.x?1:-1;
p.update(dt,foe);}

function separate(a,b){const min=(a.bodyW+b.bodyW)*.36,d=b.x-a.x,ad=Math.abs(d);if(ad<min&&ad>.01){const push=(min-ad)/2*Math.sign(d||1);a.x-=push;b.x+=push;a.x=Math.max(48,Math.min(W-48,a.x));b.x=Math.max(48,Math.min(W-48,b.x));}}

const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const b=bg.getContext('2d');const sky=b.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#160b2e');sky.addColorStop(.55,'#2a1148');sky.addColorStop(1,'#0b0718');b.fillStyle=sky;b.fillRect(0,0,W,H);
b.fillStyle='#1c1038';for(let i=0;i<22;i++){const w=30+Math.random()*70,h=60+Math.random()*160;b.fillRect(i*46-10,H-200-h,w,h);}
for(const x of[180,480,780]){const g=b.createLinearGradient(x,0,x,GROUND);g.addColorStop(0,'rgba(139,92,246,.28)');g.addColorStop(1,'rgba(139,92,246,0)');b.fillStyle=g;b.beginPath();b.moveTo(x-30,0);b.lineTo(x+30,0);b.lineTo(x+130,GROUND);b.lineTo(x-130,GROUND);b.fill();}
for(let row=0;row<3;row++){const y=250+row*26;for(let x=20;x<W;x+=22){b.fillStyle=`hsl(${(x*7+row*40)%360},60%,${35+row*8}%)`;b.beginPath();b.arc(x+(row%2)*11,y,7,0,7);b.fill();}}
b.fillStyle='rgba(0,0,0,.35)';b.fillRect(0,300,W,160);
const floor=b.createLinearGradient(0,340,0,H);floor.addColorStop(0,'#3b1d5e');floor.addColorStop(1,'#170a2b');b.fillStyle=floor;b.fillRect(0,340,W,H-340);
b.strokeStyle='rgba(255,255,255,.1)';b.lineWidth=2;for(let i=-6;i<=6;i++){b.beginPath();b.moveTo(W/2+i*40,350);b.lineTo(W/2+i*150,H);b.stroke();}
b.strokeStyle='rgba(34,211,238,.55)';b.lineWidth=5;b.beginPath();b.moveTo(0,GROUND+8);b.lineTo(W,GROUND+8);b.stroke();
b.strokeStyle='rgba(255,77,148,.5)';b.beginPath();b.moveTo(0,GROUND+16);b.lineTo(W,GROUND+16);b.stroke();})();

function drawHumanoid(c,f,o){const t=f.animT,walking=f.state==='walk',swing=walking?Math.sin(t*13):0;let armF=0,lean=0,bob=walking?Math.abs(Math.sin(t*13))*3:Math.sin(t*3)*2;
if(f.state==='attack'){const p=Math.min(1,f.attackT/f.attackDur);armF=p<.4?-18*p/.4:62*Math.min(1,(p-.3)/.25);lean=6;}
if(f.state==='hit')lean=-14;
c.save();c.translate(f.x,f.y);
if(f.ko){const r=Math.min(1,f.koT*2.6);c.rotate(-f.facing*r*Math.PI/2);c.globalAlpha=Math.max(.15,1-Math.max(0,f.koT-1.2)/2);}
c.scale(f.facing,1);c.translate(0,-bob);
const flash=f.flash>0,skin=flash?'#ffb3b3':o.skin,top=flash?'#ffdede':o.top,bottom=flash?'#ffdede':o.bottom;
c.lineCap='round';c.strokeStyle=bottom;c.lineWidth=11;
c.beginPath();c.moveTo(-6,-58);c.lineTo(-10-swing*12,-4);c.stroke();
c.beginPath();c.moveTo(6,-58);c.lineTo(10+swing*12,-4);c.stroke();
c.fillStyle=o.shoes;c.beginPath();c.ellipse(-10-swing*12,-3,10,5,0,0,7);c.fill();c.beginPath();c.ellipse(10+swing*12,-3,10,5,0,0,7);c.fill();
c.fillStyle=top;c.beginPath();c.moveTo(-15,-112);c.lineTo(15,-112);c.lineTo(12,-56);c.lineTo(-12,-56);c.closePath();c.fill();
c.fillStyle=o.accent;c.fillRect(-13,-66,26,8);
c.strokeStyle=skin;c.lineWidth=9;
c.beginPath();c.moveTo(-10,-104);c.lineTo(-20-swing*6,-72);c.stroke();
c.beginPath();c.moveTo(10,-104);c.lineTo(20+armF,-78+(f.state==='attack'?-8:swing*4));c.stroke();
c.fillStyle=skin;c.beginPath();c.arc(-20-swing*6,-70,7,0,7);c.fill();c.beginPath();c.arc(20+armF,-76+(f.state==='attack'?-8:swing*4),8,0,7);c.fill();
c.fillStyle=skin;c.beginPath();c.arc(2,-128,15,0,7);c.fill();
c.fillStyle=o.hair;
if(o.hairStyle==='long'){c.beginPath();c.moveTo(-14,-136);c.quadraticCurveTo(-26,-108,-16,-78);c.quadraticCurveTo(-4,-92,-10,-136);c.fill();c.beginPath();c.arc(2,-132,16,Math.PI,0);c.fill();c.beginPath();c.ellipse(-14,-116,7,20,-.3,0,7);c.fill();}
else{c.beginPath();c.arc(2,-132,16,Math.PI*1.05,Math.PI*2.05);c.fill();c.beginPath();c.moveTo(-12,-134);c.lineTo(-2,-150);c.lineTo(4,-136);c.fill();}
c.fillStyle='#1e1b2e';c.beginPath();c.arc(8,-130,2.4,0,7);c.fill();c.beginPath();c.arc(1,-130,2.4,0,7);c.fill();
c.strokeStyle='#1e1b2e';c.lineWidth=2;c.beginPath();if(f.state==='hit'||f.ko)c.arc(5,-120,4,0,Math.PI);else c.arc(5,-121,4,.15,Math.PI-.15);c.stroke();
if(o.headband){c.fillStyle=o.headband;c.fillRect(-13,-140,30,6);}
c.restore();}

function drawPlayer(c,f){drawHumanoid(c,f,{skin:'#f6c9a0',hair:'#2b2118',hairStyle:'short',top:'#2563eb',bottom:'#1e3a8a',accent:'#fbbf24',shoes:'#111827',headband:'#ef4444'});}
function drawErika(c,f){drawHumanoid(c,f,{skin:'#f8cfae',hair:'#7c2d5e',hairStyle:'long',top:'#a855f7',bottom:'#f472b6',accent:'#fbbf24',shoes:'#4c1d95',headband:null});}
function drawFilippo(c,f){c.save();c.translate(f.x,f.y);
if(f.ko){const r=Math.min(1,f.koT*2.6);c.rotate(-f.facing*r*Math.PI/2);c.globalAlpha=Math.max(.15,1-Math.max(0,f.koT-1.2)/2);}
c.scale(f.facing,1);const h=172;
if(filippoReady){const w=filippoImg.width/filippoImg.height*h;let sx=1,sy=1;if(f.state==='hit'){sx=.93;sy=1.05;}
if(f.flash>0)c.filter='brightness(1.7) saturate(1.4)';
c.drawImage(filippoImg,-w/2*sx,-h*sy,w*sx,h*sy);c.filter='none';
if(f.flash>0){c.globalAlpha=Math.min(.55,f.flash*3.4);c.fillStyle='#ff4d4d';c.fillRect(-w/2,-h,w,h);c.globalAlpha=1;}}
else{c.fillStyle='#334155';c.fillRect(-30,-170,60,170);c.fillStyle='#fbbf24';c.font='bold 11px sans-serif';c.textAlign='center';c.fillText('JPG',0,-100);c.fillText('MISSING',0,-86);}
c.restore();}

function bar(x,y,w,h,pct,color,name){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle='#1f2937';ctx.fillRect(x,y,w,h);const g=ctx.createLinearGradient(x,y,x+w,y);g.addColorStop(0,color);g.addColorStop(1,'#fff8');ctx.fillStyle=g;ctx.fillRect(x,y,w*Math.max(0,pct),h);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);ctx.font='bold 13px "Segoe UI",sans-serif';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(name,x,y-7);}
function drawHUD(){bar(30,30,330,20,player.hp/player.maxHp,'#22c55e','YOU  '+Math.ceil(player.hp));bar(W-360,30,330,16,erika.hp/erika.maxHp,'#f472b6','ERIKA  '+Math.ceil(erika.hp));bar(W-360,66,330,16,filippo.hp/filippo.maxHp,'#fb923c','FILIPPO  '+Math.ceil(filippo.hp));ctx.textAlign='center';ctx.font='bold 26px "Segoe UI",sans-serif';ctx.fillStyle='#fff';ctx.fillText('SCORE '+score,W/2,44);if(combo>1){ctx.font='bold 20px "Segoe UI",sans-serif';ctx.fillStyle='#fbbf24';ctx.fillText('COMBO x'+combo+'  ('+bestCombo+' best)',W/2,72);}}

let state='menu',last=0,endT=0,endResult='';
function resetFight(){player.x=220;player.hp=player.maxHp;player.ko=false;player.koT=0;player.state='idle';player.hitstun=0;player.vx=0;player.vy=0;player.facing=1;
erika.x=640;erika.hp=erika.maxHp;erika.ko=false;erika.koT=0;erika.state='idle';erika.hitstun=0;erika.vx=0;erika.vy=0;erika.aiT=1;
filippo.x=800;filippo.hp=filippo.maxHp;filippo.ko=false;filippo.koT=0;filippo.state='idle';filippo.hitstun=0;filippo.vx=0;filippo.vy=0;filippo.aiT=1.6;
particles.length=0;floats.length=0;score=0;combo=0;comboT=0;bestCombo=0;shake=0;endT=0;endResult='';}
function startGame(){Sfx.init();resetFight();ui.menu.classList.add('hidden');ui.over.classList.add('hidden');ui.pause.classList.add('hidden');state='playing';}
function togglePause(){if(state==='playing'){state='paused';ui.pause.classList.remove('hidden');}else if(state==='paused'){state='playing';ui.pause.classList.add('hidden');}}
function endGame(win){endResult=win?'win':'lose';state='ending';endT=.9;if(win)Sfx.win();}
function showOver(){state='over';ui.overTitle.textContent=endResult==='win'?'VICTORY!':'DEFEATED';ui.overTitle.style.color=endResult==='win'?'#22d3ee':'#ff5470';ui.overScore.textContent='SCORE: '+score+'   BEST COMBO: x'+bestCombo;ui.over.classList.remove('hidden');}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('againBtn').onclick=startGame;
document.getElementById('resumeBtn').onclick=togglePause;
document.getElementById('quitBtn').onclick=()=>{ui.pause.classList.add('hidden');startGame();};

function update(dt){updatePlayer(dt);for(const e of enemies)updateEnemy(e,dt);separate(player,erika);separate(player,filippo);separate(erika,filippo);updateEffects(dt);if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
if(player.ko)endGame(false);else if(aliveEnemies().length===0)endGame(true);}
function render(dt){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake*22,(Math.random()-.5)*shake*16);ctx.drawImage(bg,0,0);
const order=[erika,filippo,player].sort((a,b)=>a.y-b.y);
for(const f of order){if(f===player)drawPlayer(ctx,f);else if(f===erika)drawErika(ctx,f);else drawFilippo(ctx,f);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(f.x,GROUND+6,26,7,0,0,7);ctx.fill();}
drawEffects();ctx.restore();drawHUD();
if(state==='ending'){endT-=dt;if(endT<=0)showOver();}}
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;if(state==='playing')update(dt);else if(state==='ending')updateEffects(dt);render(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
