<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HTML Fighting Game: Beat Erika or Filippo</title>
<style>
:root{--pink:#ff4d94;--purple:#8b5cf6;--cyan:#22d3ee;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07060f;color:#fff;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));display:block;border-radius:10px;box-shadow:0 0 60px rgba(139,92,246,.35),0 0 120px rgba(34,211,238,.15);touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,3,12,.86);backdrop-filter:blur(5px);z-index:6;padding:16px}
.hidden{display:none!important}
.panel{text-align:center;padding:clamp(18px,4vw,40px);border:2px solid rgba(139,92,246,.55);border-radius:18px;background:linear-gradient(160deg,rgba(23,16,48,.96),rgba(9,7,22,.96));box-shadow:0 0 40px rgba(139,92,246,.35);max-width:min(92vw,620px)}
h1{font-size:clamp(24px,5.5vw,50px);line-height:1.1;letter-spacing:3px;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(24px,4.5vw,42px);letter-spacing:2px}
.sub{margin:12px 0 20px;color:#c7d2fe;letter-spacing:1px}
.choose{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.btn{font:inherit;font-weight:800;letter-spacing:2px;padding:15px 30px;border:0;border-radius:14px;cursor:pointer;color:#12061f;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 6px 24px rgba(255,77,148,.4);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.erika{background:linear-gradient(90deg,#f472b6,#a855f7);color:#fff}
.btn.filippo{background:linear-gradient(90deg,#fb923c,#facc15);color:#231000}
.btn.secondary{background:#334155;color:#fff;margin-left:10px}
.controls-help{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-bottom:18px;font-size:clamp(11px,2.4vw,14px);color:#a5b4fc}
.controls-help b{color:#fff}
.warn{margin-top:14px;color:#fbbf24;font-size:clamp(11px,2.6vw,14px)}
#mobile{position:absolute;inset:auto 0 max(10px,env(safe-area-inset-bottom)) 0;display:none;justify-content:space-between;align-items:flex-end;padding:0 max(10px,env(safe-area-inset-left)) 0 max(10px,env(safe-area-inset-right));z-index:5;pointer-events:none}
.pad{display:flex;gap:10px;align-items:flex-end;pointer-events:none}
.mbtn{pointer-events:auto;width:clamp(58px,15vw,76px);height:clamp(58px,15vw,76px);border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(18,14,38,.72);color:#fff;font:800 clamp(9px,2.4vw,12px)/1 "Segoe UI",sans-serif;letter-spacing:.5px;touch-action:none;user-select:none;-webkit-user-select:none;backdrop-filter:blur(3px);transition:transform .07s,background .07s}
.mbtn:active,.mbtn.pressed{transform:scale(.9);background:rgba(139,92,246,.85)}
.mbtn.move{font-size:clamp(16px,4vw,22px)}
.mbtn.punch{background:rgba(255,77,148,.78);border-color:#fff}
.mbtn.kick{background:rgba(251,191,36,.78);border-color:#fff;color:#231000}
.mbtn.block{background:rgba(34,211,238,.65)}
.mbtn.jump{background:rgba(167,139,250,.7)}
@media (pointer:coarse){#mobile{display:flex}}
@media (max-width:520px){.pad.right{gap:7px}.mbtn{width:clamp(50px,13vw,64px);height:clamp(50px,13vw,64px)}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="960" height="540"></canvas>
<div id="menu" class="overlay"><div class="panel"><h1>BEAT ERIKA<br>OR FILIPPO</h1><p class="sub">Choose your opponent</p><div class="choose"><button id="fightErika" class="btn erika">FIGHT ERIKA</button><button id="fightFilippo" class="btn filippo">FIGHT FILIPPO</button></div><div class="controls-help"><span><b>A / D</b> Move</span><span><b>W</b> Jump</span><span><b>J</b> / <b>Space</b> Punch</span><span><b>K</b> Kick</span><span><b>Shift</b> Block</span><span><b>P</b> Pause</span></div><p id="filippoWarn" class="warn hidden">Add Filippo\u2019s image as <b>assets/filippo.png</b>, <b>assets/filippo.jpg</b>, or <b>assets/filippo.jpeg</b>.</p></div></div>
<div id="pause" class="overlay hidden"><div class="panel"><h2>PAUSED</h2><button id="resumeBtn" class="btn">RESUME</button><button id="quitBtn" class="btn secondary">RESTART</button></div></div>
<div id="over" class="overlay hidden"><div class="panel"><h2 id="overTitle">VICTORY</h2><p id="overScore" class="sub">SCORE: 0</p><button id="againBtn" class="btn">FIGHT AGAIN</button><button id="menuBtn" class="btn secondary">CHANGE OPPONENT</button></div></div>
<div id="mobile"><div class="pad left"><button id="btnLeft" class="mbtn move">&#9664;</button><button id="btnRight" class="mbtn move">&#9654;</button></div><div class="pad right"><button id="btnBlock" class="mbtn action block">BLOCK</button><button id="btnJump" class="mbtn action jump">JUMP</button><button id="btnPunch" class="mbtn action punch">PUNCH</button><button id="btnKick" class="mbtn action kick">KICK</button></div></div>
</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=960,H=540,GROUND=458,GRAV=2500;
const ui={menu:document.getElementById('menu'),pause:document.getElementById('pause'),over:document.getElementById('over'),overTitle:document.getElementById('overTitle'),overScore:document.getElementById('overScore'),filippoWarn:document.getElementById('filippoWarn')};
const keys={},touch={left:false,right:false,jump:false,punch:false,kick:false,block:false};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyP'&&(state==='playing'||state==='paused'))togglePause();if(e.code==='Enter'&&state==='menu')startGame('erika');});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function bindBtn(id,prop){const el=document.getElementById(id);const on=e=>{e.preventDefault();touch[prop]=true;el.classList.add('pressed');};const off=()=>{touch[prop]=false;el.classList.remove('pressed');};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);el.addEventListener('contextmenu',e=>e.preventDefault());}
bindBtn('btnLeft','left');bindBtn('btnRight','right');bindBtn('btnJump','jump');bindBtn('btnPunch','punch');bindBtn('btnKick','kick');bindBtn('btnBlock','block');
const Sfx={ctx:null,init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},blip(f1,f2,dur,type,vol){if(!this.ctx)return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+dur);},punch(){this.blip(240,90,0.09,'square',0.16);},kick(){this.blip(160,60,0.13,'square',0.2);},hit(){this.blip(520,120,0.14,'sawtooth',0.22);},block(){this.blip(900,480,0.08,'triangle',0.14);},ko(){this.blip(320,40,0.55,'sawtooth',0.28);},win(){this.blip(440,900,0.45,'triangle',0.22);}};
const particles=[],floats=[];let shake=0;
function spawnParticles(x,y,n,color,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(0.35+Math.random());particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-140,life:0.35+Math.random()*0.3,color,size:2+Math.random()*3.5});}}
function addFloat(x,y,text,color,big){floats.push({x,y,text,color,life:0.95,big:!!big});}
function updateEffects(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;if(p.life<=0)particles.splice(i,1);}for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=55*dt;if(f.life<=0)floats.splice(i,1);}if(shake>0)shake-=dt;}
function drawEffects(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2.2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}ctx.globalAlpha=1;ctx.textAlign='center';for(const f of floats){ctx.globalAlpha=Math.min(1,f.life*1.6);ctx.font=(f.big?'bold 30px':'bold 20px')+' "Segoe UI",sans-serif';ctx.fillStyle='#000';ctx.fillText(f.text,f.x+2,f.y+2);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);}ctx.globalAlpha=1;}
class Fighter{constructor(cfg){Object.assign(this,{x:200,y:GROUND,vx:0,vy:0,facing:1,hp:100,maxHp:100,speed:260,jumpV:-880,state:'idle',animT:0,attackT:0,attackKind:'punch',cooldown:0,hitstun:0,flash:0,blocking:false,blockT:0,ko:false,koT:0,hasHit:false,aiT:0,punchDmg:8,punchRange:100,punchWindup:0.13,punchDur:0.32,punchCooldown:0.85,kickDmg:14,kickRange:118,kickWindup:0.19,kickDur:0.42,kickCooldown:1.5,knockback:260,heavy:false,blockChance:0.35,rethink:1.0,dash:false,isPlayer:false,name:'',bodyW:52,bodyH:150},cfg);}
get airborne(){return this.y<GROUND-1;}
rect(){return{x:this.x-this.bodyW/2,y:this.y-this.bodyH,w:this.bodyW,h:this.bodyH};}
attackStats(){return this.attackKind==='kick'?{dmg:this.kickDmg,range:this.kickRange,windup:this.kickWindup,dur:this.kickDur,cd:this.kickCooldown,kb:this.knockback*1.5}:{dmg:this.punchDmg,range:this.punchRange,windup:this.punchWindup,dur:this.punchDur,cd:this.punchCooldown,kb:this.knockback};}
startAttack(kind){if(this.cooldown>0||this.state==='attack'||this.hitstun>0||this.ko)return;this.attackKind=kind;this.state='attack';this.attackT=0;this.hasHit=false;if(kind==='kick')Sfx.kick();else Sfx.punch();}
tryHit(foe){if(!foe||foe.ko||this.hasHit)return;const s=this.attackStats(),dir=this.facing,reach=this.attackKind==='kick'?24:14,hx=dir>0?this.x+reach:this.x-reach-84,box={x:hx,y:this.y-132,w:84,h:122},r=foe.rect();if(box.x<r.x+r.w&&box.x+box.w>r.x&&box.y<r.y+r.h&&box.y+box.h>r.y){this.hasHit=true;const blocked=foe.blocking&&Math.sign(foe.x-this.x)===-dir;let dmg=s.dmg*(0.9+Math.random()*0.2);const crit=Math.random()<0.15;if(crit)dmg*=1.6;if(blocked){dmg*=0.22;Sfx.block();spawnParticles((this.x+foe.x)/2,foe.y-85,8,'#e0f2fe',200);}else{foe.hitstun=this.attackKind==='kick'?0.38:0.28;Sfx.hit();spawnParticles(foe.x,foe.y-85,this.attackKind==='kick'?18:12,'#ffd166',320);if(this.attackKind==='kick')shake=Math.max(shake,0.28);}dmg=Math.max(1,Math.round(dmg));foe.hp=Math.max(0,foe.hp-dmg);foe.flash=0.18;foe.vx=dir*s.kb*(blocked?0.25:1);if(!blocked&&(this.heavy||this.attackKind==='kick'))foe.vy=-280;addFloat(foe.x,foe.y-155,(blocked?'BLOCK ':'')+dmg+(crit?'!':''),crit?'#ff5470':(blocked?'#93c5fd':'#fff'),crit);if(this.isPlayer&&!blocked)onPlayerHit(dmg,crit);if(foe.hp<=0){foe.ko=true;foe.state='ko';foe.vx=dir*340;foe.vy=-330;Sfx.ko();spawnParticles(foe.x,foe.y-85,28,'#ff9f43',380);shake=0.55;}}}
physics(dt){this.vy+=GRAV*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.y>=GROUND){this.y=GROUND;this.vy=0;}this.vx*=Math.pow(this.airborne?0.9:0.004,dt);this.x=Math.max(48,Math.min(W-48,this.x));}
update(dt,foe){this.animT+=dt;if(this.cooldown>0)this.cooldown-=dt;if(this.flash>0)this.flash-=dt;if(this.ko){this.koT+=dt;this.physics(dt);return;}if(this.hitstun>0){this.hitstun-=dt;this.state='hit';this.physics(dt);return;}if(this.state==='attack'){this.attackT+=dt;const s=this.attackStats();if(!this.hasHit&&this.attackT>=s.windup&&this.attackT<=s.windup+0.12)this.tryHit(foe);if(this.attackT>=s.dur){this.state='idle';this.cooldown=s.cd;}this.vx*=Math.pow(0.02,dt);}this.physics(dt);}}
const player=new Fighter({isPlayer:true,name:'YOU',hp:130,maxHp:130,speed:310,jumpV:-900,punchDmg:10,punchRange:105,punchWindup:0.10,punchDur:0.28,punchCooldown:0.38,kickDmg:17,kickRange:122,kickWindup:0.18,kickDur:0.40,kickCooldown:0.85,knockback:300,bodyW:50,bodyH:152});
const erika=new Fighter({name:'ERIKA',hp:100,maxHp:100,speed:275,jumpV:-920,punchDmg:7,punchRange:100,punchWindup:0.11,punchDur:0.28,punchCooldown:0.8,kickDmg:12,kickRange:115,kickWindup:0.2,kickDur:0.4,kickCooldown:1.5,knockback:230,blockChance:0.5,rethink:0.7,dash:true,bodyW:50,bodyH:150});
const filippo=new Fighter({name:'FILIPPO',hp:130,maxHp:130,speed:180,jumpV:-820,punchDmg:13,punchRange:112,punchWindup:0.17,punchDur:0.36,punchCooldown:1.35,kickDmg:20,kickRange:128,kickWindup:0.26,kickDur:0.48,kickCooldown:2.1,knockback:420,heavy:true,blockChance:0.3,rethink:1.25,bodyW:62,bodyH:172});
let opponent=null;
const filippoImg=new Image();let filippoReady=false,filippoFailed=false;
const filippoCandidates=['assets/filippo.png','assets/filippo.jpg','assets/filippo.jpeg','assets/filippo.JPG','assets/filippo.JPEG'];let filippoCandidate=0;
function loadFilippo(){if(filippoCandidate>=filippoCandidates.length){filippoFailed=true;ui.filippoWarn.classList.remove('hidden');return;}filippoImg.src=filippoCandidates[filippoCandidate];}
filippoImg.onload=()=>{filippoReady=true;filippoFailed=false;ui.filippoWarn.classList.add('hidden');};
filippoImg.onerror=()=>{filippoCandidate++;loadFilippo();};
loadFilippo();
let score=0,combo=0,comboT=0,bestCombo=0;
function onPlayerHit(dmg,crit){combo++;comboT=2.0;bestCombo=Math.max(bestCombo,combo);const mult=1+Math.floor(combo/3)*0.5,pts=Math.round(100*mult*(crit?1.5:1));score+=pts;addFloat(player.x,player.y-195,'+'+pts,'#fbbf24',true);}
function updateFoe(e,dt){if(!e)return;if(e.ko){e.update(dt,player);return;}const p=player,dx=p.x-e.x,dist=Math.abs(dx);if(e.hitstun>0){e.update(dt,p);return;}e.facing=dx>0?1:-1;e.aiT-=dt;if(p.state==='attack'&&dist<e.punchRange+40&&e.blockT<=0){if(Math.random()<e.blockChance*dt*60)e.blockT=0.45;}e.blocking=e.blockT>0;if(e.blockT>0)e.blockT-=dt;if(e.state!=='attack'){if(dist>e.punchRange*0.72){e.vx=e.facing*e.speed;e.state='walk';}else{e.vx*=0.6;e.state='idle';if(e.cooldown<=0&&e.aiT<=0){const useKick=dist>e.punchRange*0.9&&Math.random()<0.45;e.startAttack(useKick?'kick':'punch');e.aiT=e.rethink;}else if(e.aiT<=0){e.aiT=0.3+Math.random()*0.75;if(Math.random()<0.28)e.vy=e.jumpV;if(e.dash&&Math.random()<0.4)e.vx=e.facing*e.speed*2.3;}}}e.update(dt,p);}
function updatePlayer(dt){const p=player,foe=opponent&&!opponent.ko?opponent:null;if(p.ko||p.hitstun>0){p.update(dt,foe);return;}const left=keys.KeyA||keys.ArrowLeft||touch.left,right=keys.KeyD||keys.ArrowRight||touch.right;p.blocking=(keys.ShiftLeft||keys.ShiftRight||touch.block)&&!p.airborne;let mv=0;if(left)mv-=1;if(right)mv+=1;if(p.state!=='attack'){p.vx=mv*p.speed;p.state=mv!==0?'walk':'idle';if(mv!==0)p.facing=mv;}const jump=keys.KeyW||keys.ArrowUp||touch.jump;if(jump&&!p.airborne&&p.state!=='attack')p.vy=p.jumpV;if(keys.KeyJ||keys.Space||touch.punch)p.startAttack('punch');if(keys.KeyK||touch.kick)p.startAttack('kick');if(foe&&p.state!=='attack')p.facing=foe.x>p.x?1:-1;p.update(dt,foe);}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const b=bg.getContext('2d');const sky=b.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#160b2e');sky.addColorStop(0.55,'#2a1148');sky.addColorStop(1,'#0b0718');b.fillStyle=sky;b.fillRect(0,0,W,H);b.fillStyle='#1c1038';for(let i=0;i<22;i++){const w=30+Math.random()*70,h=60+Math.random()*160;b.fillRect(i*46-10,H-200-h,w,h);}for(const x of[180,480,780]){const g=b.createLinearGradient(x,0,x,GROUND);g.addColorStop(0,'rgba(139,92,246,0.28)');g.addColorStop(1,'rgba(139,92,246,0)');b.fillStyle=g;b.beginPath();b.moveTo(x-30,0);b.lineTo(x+30,0);b.lineTo(x+130,GROUND);b.lineTo(x-130,GROUND);b.fill();}for(let row=0;row<3;row++){const y=250+row*26;for(let x=20;x<W;x+=22){b.fillStyle=`hsl(${(x*7+row*40)%360},60%,${35+row*8}%)`;b.beginPath();b.arc(x+(row%2)*11,y,7,0,7);b.fill();}}b.fillStyle='rgba(0,0,0,0.35)';b.fillRect(0,300,W,160);const floor=b.createLinearGradient(0,340,0,H);floor.addColorStop(0,'#3b1d5e');floor.addColorStop(1,'#170a2b');b.fillStyle=floor;b.fillRect(0,340,W,H-340);b.strokeStyle='rgba(255,255,255,0.10)';b.lineWidth=2;for(let i=-6;i<=6;i++){b.beginPath();b.moveTo(W/2+i*40,350);b.lineTo(W/2+i*150,H);b.stroke();}b.strokeStyle='rgba(34,211,238,0.55)';b.lineWidth=5;b.beginPath();b.moveTo(0,GROUND+8);b.lineTo(W,GROUND+8);b.stroke();b.strokeStyle='rgba(255,77,148,0.5)';b.beginPath();b.moveTo(0,GROUND+16);b.lineTo(W,GROUND+16);b.stroke();})();
function drawHumanoid(c,f,o){const t=f.animT,walking=f.state==='walk',swing=walking?Math.sin(t*13):0;let armF=0,legF=0,lean=0,bob=walking?Math.abs(Math.sin(t*13))*3:Math.sin(t*3)*2;if(f.state==='attack'){const p=Math.min(1,f.attackT/f.attackStats().dur);if(f.attackKind==='kick'){legF=p<0.35?-10:70*Math.min(1,(p-0.25)/0.3);lean=-8;}else{armF=p<0.4?-18*p/0.4:64*Math.min(1,(p-0.3)/0.25);lean=6;}}if(f.state==='hit')lean=-14;c.save();c.translate(f.x,f.y);if(f.ko){const r=Math.min(1,f.koT*2.6);c.rotate(-f.facing*r*Math.PI/2);c.globalAlpha=Math.max(0.15,1-Math.max(0,(f.koT-1.2))/2);}c.scale(f.facing,1);c.translate(0,-bob);const flash=f.flash>0,skin=flash?'#ffb3b3':o.skin,top=flash?'#ffdede':o.top,bottom=flash?'#ffdede':o.bottom;c.lineCap='round';c.strokeStyle=bottom;c.lineWidth=11;c.beginPath();c.moveTo(-6,-58);c.lineTo(-10-swing*12,-4);c.stroke();c.beginPath();c.moveTo(6,-58);c.lineTo(10+swing*12+legF,-4-Math.max(0,legF)*0.55);c.stroke();c.fillStyle=o.shoes;c.beginPath();c.ellipse(-10-swing*12,-3,10,5,0,0,7);c.fill();c.beginPath();c.ellipse(10+swing*12+legF,-3-Math.max(0,legF)*0.55,10,5,0,0,7);c.fill();c.fillStyle=top;c.beginPath();c.moveTo(-15,-112);c.lineTo(15,-112);c.lineTo(12,-56);c.lineTo(-12,-56);c.closePath();c.fill();c.fillStyle=o.accent;c.fillRect(-13,-66,26,8);c.strokeStyle=skin;c.lineWidth=9;c.beginPath();c.moveTo(-10,-104);c.lineTo(-20-swing*6,-72);c.stroke();c.beginPath();c.moveTo(10,-104);c.lineTo(20+armF,-78+(f.state==='attack'&&f.attackKind==='punch'?-8:swing*4));c.stroke();c.fillStyle=skin;c.beginPath();c.arc(-20-swing*6,-70,7,0,7);c.fill();c.beginPath();c.arc(20+armF,-76+(f.state==='attack'&&f.attackKind==='punch'?-8:swing*4),8,0,7);c.fill();c.fillStyle=skin;c.beginPath();c.arc(2,-128,15,0,7);c.fill();c.fillStyle=o.hair;if(o.hairStyle==='long'){c.beginPath();c.moveTo(-14,-136);c.quadraticCurveTo(-26,-108,-16,-78);c.quadraticCurveTo(-4,-92,-10,-136);c.fill();c.beginPath();c.arc(2,-132,16,Math.PI,0);c.fill();c.beginPath();c.ellipse(-14,-116,7,20,-0.3,0,7);c.fill();}else{c.beginPath();c.arc(2,-132,16,Math.PI*1.05,Math.PI*2.05);c.fill();c.beginPath();c.moveTo(-12,-134);c.lineTo(-2,-150);c.lineTo(4,-136);c.fill();}c.fillStyle='#1e1b2e';c.beginPath();c.arc(8,-130,2.4,0,7);c.fill();c.beginPath();c.arc(1,-130,2.4,0,7);c.fill();c.strokeStyle='#1e1b2e';c.lineWidth=2;c.beginPath();if(f.state==='hit'||f.ko)c.arc(5,-120,4,0,Math.PI);else c.arc(5,-121,4,0.15,Math.PI-0.15);c.stroke();if(o.headband){c.fillStyle=o.headband;c.fillRect(-13,-140,30,6);}c.restore();}
function drawPlayer(c,f){drawHumanoid(c,f,{skin:'#f6c9a0',hair:'#2b2118',hairStyle:'short',top:'#2563eb',bottom:'#1e3a8a',accent:'#fbbf24',shoes:'#111827',headband:'#ef4444'});}
function drawErika(c,f){drawHumanoid(c,f,{skin:'#f8cfae',hair:'#7c2d5e',hairStyle:'long',top:'#a855f7',bottom:'#f472b6',accent:'#fbbf24',shoes:'#4c1d95',headband:null});}
function drawFilippo(c,f){c.save();c.translate(f.x,f.y);if(f.ko){const r=Math.min(1,f.koT*2.6);c.rotate(-f.facing*r*Math.PI/2);c.globalAlpha=Math.max(0.15,1-Math.max(0,(f.koT-1.2))/2);}c.scale(f.facing,1);const h=174;if(filippoReady){const w=filippoImg.width/filippoImg.height*h;let sx=1,sy=1;if(f.state==='hit'){sx=0.93;sy=1.05;}if(f.flash>0)c.filter='brightness(1.7) saturate(1.4)';c.drawImage(filippoImg,-w/2*sx,-h*sy,w*sx,h*sy);c.filter='none';if(f.flash>0){c.globalAlpha=Math.min(0.55,f.flash*3.4);c.fillStyle='#ff4d4d';c.fillRect(-w/2,-h,w,h);c.globalAlpha=1;}}else{c.fillStyle='#334155';c.fillRect(-30,-172,60,172);c.fillStyle='#fbbf24';c.font='bold 11px sans-serif';c.textAlign='center';c.fillText('IMAGE',0,-100);c.fillText('MISSING',0,-86);}c.restore();}
function bar(x,y,w,h,pct,color,name){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle='#1f2937';ctx.fillRect(x,y,w,h);const g=ctx.createLinearGradient(x,y,x+w,y);g.addColorStop(0,color);g.addColorStop(1,'#fff8');ctx.fillStyle=g;ctx.fillRect(x,y,w*Math.max(0,pct),h);ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);ctx.font='bold 13px "Segoe UI",sans-serif';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(name,x,y-7);}
function drawHUD(){bar(30,30,330,20,player.hp/player.maxHp,'#22c55e','YOU  '+Math.ceil(player.hp));if(opponent){const color=opponent===erika?'#f472b6':'#fb923c';bar(W-360,30,330,20,opponent.hp/opponent.maxHp,color,opponent.name+'  '+Math.ceil(opponent.hp));}ctx.textAlign='center';ctx.font='bold 26px "Segoe UI",sans-serif';ctx.fillStyle='#fff';ctx.fillText('SCORE '+score,W/2,44);if(combo>1){ctx.font='bold 20px "Segoe UI",sans-serif';ctx.fillStyle='#fbbf24';ctx.fillText('COMBO x'+combo+'  ('+bestCombo+' best)',W/2,72);}}
let state='menu',last=0,endT=0,endResult='';
function resetFight(){const reset=f=>{f.hp=f.maxHp;f.ko=false;f.koT=0;f.state='idle';f.hitstun=0;f.vx=0;f.vy=0;f.cooldown=0;f.flash=0;f.aiT=0.8;};reset(player);reset(erika);reset(filippo);player.x=220;player.facing=1;erika.x=680;filippo.x=680;particles.length=0;floats.length=0;score=0;combo=0;comboT=0;bestCombo=0;shake=0;endT=0;endResult='';}
function startGame(who){Sfx.init();opponent=who==='filippo'?filippo:erika;resetFight();ui.menu.classList.add('hidden');ui.over.classList.add('hidden');ui.pause.classList.add('hidden');state='playing';}
function toMenu(){state='menu';opponent=null;resetFight();ui.pause.classList.add('hidden');ui.over.classList.add('hidden');ui.menu.classList.remove('hidden');}
function togglePause(){if(state==='playing'){state='paused';ui.pause.classList.remove('hidden');}else if(state==='paused'){state='playing';ui.pause.classList.add('hidden');}}
function endGame(win){endResult=win?'win':'lose';state='ending';endT=0.9;if(win)Sfx.win();}
function showOver(){state='over';ui.overTitle.textContent=endResult==='win'?'VICTORY!':'DEFEATED';ui.overTitle.style.color=endResult==='win'?'#22d3ee':'#ff5470';ui.overScore.textContent='SCORE: '+score+'   BEST COMBO: x'+bestCombo;ui.over.classList.remove('hidden');}
document.getElementById('fightErika').onclick=()=>startGame('erika');
document.getElementById('fightFilippo').onclick=()=>startGame('filippo');
document.getElementById('againBtn').onclick=()=>startGame(opponent===filippo?'filippo':'erika');
document.getElementById('menuBtn').onclick=toMenu;
document.getElementById('resumeBtn').onclick=togglePause;
document.getElementById('quitBtn').onclick=()=>{ui.pause.classList.add('hidden');startGame(opponent===filippo?'filippo':'erika');};
function update(dt){updatePlayer(dt);updateFoe(opponent,dt);if(opponent){const min=(player.bodyW+opponent.bodyW)*0.36,d=opponent.x-player.x,ad=Math.abs(d);if(ad<min&&ad>0.01){const push=(min-ad)/2*Math.sign(d||1);player.x-=push;opponent.x+=push;player.x=Math.max(48,Math.min(W-48,player.x));opponent.x=Math.max(48,Math.min(W-48,opponent.x));}}updateEffects(dt);if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}if(player.ko)endGame(false);else if(opponent&&opponent.ko)endGame(true);}
function render(dt){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-0.5)*shake*22,(Math.random()-0.5)*shake*16);ctx.drawImage(bg,0,0);const order=opponent?[opponent,player].sort((a,b)=>a.y-b.y):[player];for(const f of order){ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(f.x,GROUND+6,26,7,0,0,7);ctx.fill();if(f===player)drawPlayer(ctx,f);else if(f===erika)drawErika(ctx,f);else drawFilippo(ctx,f);}drawEffects();ctx.restore();drawHUD();if(state==='ending'){endT-=dt;if(endT<=0)showOver();}}
function loop(ts){const dt=Math.min(0.033,(ts-last)/1000||0);last=ts;if(state==='playing')update(dt);else if(state==='ending')updateEffects(dt);render(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
